services:
  - type: web
    name: fihay-frms
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fihay-frms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: ALLOW_REGISTRATION
        value: "1"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: fihay-data
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: fihay-frms-db
    plan: 0.1c-256mb
    region: frankfurt
    diskSizeGB: 1
    databaseName: fihay_frms
    user: fihay_frms
