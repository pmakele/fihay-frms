services:
  - type: web
    name: fihay-frms
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fihay-frms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: ALLOW_REGISTRATION
        value: "1"
      - key: DATA_DIR
        value: /tmp/fihay-data

databases:
  - name: fihay-frms-db
    plan: free
    region: frankfurt
    databaseName: fihay_frms
    user: fihay_frms
